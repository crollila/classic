server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    location = / { return 302 /forever-sim/; }
    location = /forever-sim { return 308 /forever-sim/; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /forever-sim/bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /forever-sim/ {
        # HTML, release metadata, data and the unversioned worker/WASM must
        # revalidate together. Never fall back to the main website's index.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
