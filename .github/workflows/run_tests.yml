name: Classic baseline and Forever isolation
on:
  pull_request:
    branches: [master]
  push:
    branches: ['forever/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.13.1'
          cache: npm
      - name: Install pinned dependencies
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          npm ci
      - name: Preserve the known Classic implementation
        run: npm run check:classic
      - name: Build browser, WebAssembly, and CLIs
        run: npm run build
      - name: Run upstream regressions and version isolation tests
        run: npm test
